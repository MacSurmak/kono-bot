version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: kono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kono_supply}
      POSTGRES_USER: ${POSTGRES_USER:-kono_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kono_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kono_network

  redis:
    image: redis:7-alpine
    container_name: kono-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kono_network

  iiko-bot:
    build: .
    container_name: kono-iiko-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-kono_supply}
      - POSTGRES_USER=${POSTGRES_USER:-kono_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kono_secure_password}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - kono_network

volumes:
  postgres_data:
  redis_data:

networks:
  kono_network:
    driver: bridge
